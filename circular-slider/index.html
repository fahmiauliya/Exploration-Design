<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Circular Slider</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>

    <div class="device-frame">

      <!-- ── DYNAMIC ISLAND ─────────────────────────── -->
      <div class="dynamic-island"></div>

      <!-- ── STATUS BAR ────────────────────────────── -->
      <div class="status-bar">
        <span class="status-time">9:41</span>
        <div class="status-icons">
          <svg width="17" height="12" viewBox="0 0 17 12" fill="none">
            <rect x="0" y="5" width="3" height="7" rx="1" fill="currentColor" opacity="0.3"/>
            <rect x="4.5" y="3" width="3" height="9" rx="1" fill="currentColor" opacity="0.5"/>
            <rect x="9" y="1" width="3" height="11" rx="1" fill="currentColor" opacity="0.75"/>
            <rect x="13.5" y="0" width="3" height="12" rx="1" fill="currentColor"/>
          </svg>
          <svg width="16" height="12" viewBox="0 0 16 12" fill="none">
            <path d="M8 10.5C8.828 10.5 9.5 9.828 9.5 9C9.5 8.172 8.828 7.5 8 7.5C7.172 7.5 6.5 8.172 6.5 9C6.5 9.828 7.172 10.5 8 10.5Z" fill="currentColor"/>
            <path d="M4.5 7C5.8 5.7 7 5.2 8 5.2C9 5.2 10.2 5.7 11.5 7" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
            <path d="M1.5 4.2C3.6 2.1 5.8 1 8 1C10.2 1 12.4 2.1 14.5 4.2" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" opacity="0.5"/>
          </svg>
          <div class="battery-wrap">
            <div class="battery-body"><div class="battery-fill"></div></div>
            <div class="battery-cap"></div>
          </div>
        </div>
      </div>

      <!-- ── HEADER ────────────────────────────────── -->
      <header class="header">
        <button class="header-btn" aria-label="Back">
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
            <path d="M11 15L5 9L11 3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
        <h1 class="header-title">Rewards</h1>
        <button class="header-btn" aria-label="Info">
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
            <circle cx="9" cy="9" r="7.5" stroke="currentColor" stroke-width="1.4"/>
            <path d="M9 8V13" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
            <circle cx="9" cy="5.8" r="0.7" fill="currentColor"/>
          </svg>
        </button>
      </header>

      <!-- ── DIAL SECTION ──────────────────────────── -->
      <div class="dial-section">
        <div class="dial-container" id="dialContainer">
          <!-- SVG Ring -->
          <svg class="dial-svg" id="dialSvg" viewBox="0 0 373 373">
            <defs>
              <linearGradient id="arcGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#FB923C"/>
                <stop offset="100%" stop-color="#EA580C"/>
              </linearGradient>
              <filter id="arcGlow">
                <feGaussianBlur stdDeviation="8" result="blur"/>
                <feMerge>
                  <feMergeNode in="blur"/>
                  <feMergeNode in="SourceGraphic"/>
                </feMerge>
              </filter>
              <filter id="handleGlow">
                <feGaussianBlur stdDeviation="5" result="blur"/>
                <feMerge>
                  <feMergeNode in="blur"/>
                  <feMergeNode in="SourceGraphic"/>
                </feMerge>
              </filter>
            </defs>

            <!-- Tick marks -->
            <g id="ticks" class="ticks"></g>

            <!-- Background track -->
            <circle class="dial-track"
              cx="186.5" cy="186.5" r="149"
              fill="none"
              stroke="rgba(0,0,0,0.06)"
              stroke-width="10"
              stroke-linecap="round"/>

            <!-- Progress arc (glow layer) -->
            <circle class="dial-progress-glow" id="progressGlow"
              cx="186.5" cy="186.5" r="149"
              fill="none"
              stroke="url(#arcGrad)"
              stroke-width="15"
              stroke-linecap="round"
              stroke-dasharray="0 936"
              stroke-dashoffset="0"
              filter="url(#arcGlow)"
              opacity="0.4"
              transform="rotate(-90 186.5 186.5)"/>

            <!-- Progress arc -->
            <circle class="dial-progress" id="progressArc"
              cx="186.5" cy="186.5" r="149"
              fill="none"
              stroke="url(#arcGrad)"
              stroke-width="10"
              stroke-linecap="round"
              stroke-dasharray="0 936"
              stroke-dashoffset="0"
              transform="rotate(-90 186.5 186.5)"/>

            <!-- Handle -->
            <g id="handleGroup" class="handle-group">
              <circle class="handle-glow" r="20" fill="#F97316" opacity="0.3" filter="url(#handleGlow)"/>
              <circle class="handle-outer" r="16" fill="#F97316"/>
              <circle class="handle-inner" r="6" fill="#FFFFFF"/>
            </g>
          </svg>

          <!-- Center content -->
          <div class="dial-center">
            <div class="dial-value" id="dialValue">0</div>
            <div class="dial-label">RevPoints</div>
          </div>
        </div>
      </div>

      <!-- ── REWARD INFO ───────────────────────────── -->
      <div class="reward-card" id="rewardCard">
        <div class="reward-row">
          <div class="reward-icon">🎁</div>
          <div class="reward-info">
            <span class="reward-title" id="rewardTitle">Select points to redeem</span>
            <span class="reward-sub" id="rewardSub">Drag the dial to choose amount</span>
          </div>
        </div>
        <div class="reward-tiers" id="rewardTiers">
          <button class="tier-btn" data-pts="100">100</button>
          <button class="tier-btn" data-pts="250">250</button>
          <button class="tier-btn" data-pts="500">500</button>
          <button class="tier-btn" data-pts="1000">1K</button>
        </div>
      </div>

      <!-- ── REDEEM BUTTON ─────────────────────────── -->
      <div class="action-area">
        <button class="btn-redeem" id="btnRedeem">Redeem points</button>
      </div>

      <!-- ── HOME INDICATOR ────────────────────────── -->
      <div class="home-bar"></div>

    </div>

    <script src="script.js"></script>
  </body>
</html>
