<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Canopi Date Picker</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<div class="scene">
  <div class="phone">

    <!-- Dynamic Island -->
    <div class="dynamic-island"></div>

    <!-- Status Bar -->
    <div class="status-bar">
      <span class="status-time">9:41</span>
      <div class="status-right">
        <!-- Signal bars -->
        <svg class="status-icon" width="17" height="12" viewBox="0 0 17 12" fill="currentColor">
          <rect x="0"   y="6"  width="3" height="6" rx="1"/>
          <rect x="4.5" y="4"  width="3" height="8" rx="1"/>
          <rect x="9"   y="2"  width="3" height="10" rx="1"/>
          <rect x="13.5" y="0" width="3" height="12" rx="1" opacity="0.3"/>
        </svg>
        <!-- Wifi -->
        <svg class="status-icon" width="16" height="12" viewBox="0 0 16 12" fill="currentColor">
          <path d="M8 9.5a1.5 1.5 0 1 1 0 3 1.5 1.5 0 0 1 0-3z"/>
          <path d="M3.5 6.5C5 4.8 6.4 4 8 4s3 .8 4.5 2.5" stroke="currentColor" stroke-width="1.4" fill="none" stroke-linecap="round"/>
          <path d="M1 3.5C3.2 1.3 5.5 0 8 0s4.8 1.3 7 3.5" stroke="currentColor" stroke-width="1.4" fill="none" stroke-linecap="round"/>
        </svg>
        <!-- Battery -->
        <svg class="status-icon" width="25" height="12" viewBox="0 0 25 12" fill="currentColor">
          <rect x="0.5" y="0.5" width="21" height="11" rx="3.5" stroke="currentColor" stroke-opacity="0.35" fill="none"/>
          <rect x="22" y="3.5" width="2.5" height="5" rx="1.25" opacity="0.4"/>
          <rect x="2" y="2" width="16" height="8" rx="2"/>
        </svg>
      </div>
    </div>

    <!-- App Background Screen -->
    <div class="app-screen" id="appScreen">
      <div class="app-nav">
        <span class="app-nav-title">New Collection</span>
        <button class="app-close-btn" id="appCloseBtn">
          <svg width="11" height="11" viewBox="0 0 11 11" fill="none">
            <path d="M1 1l9 9M10 1L1 10" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
          </svg>
        </button>
      </div>

      <div class="app-body">
        <div class="app-placeholder">
          <div class="app-placeholder-title">Add a Title...</div>
          <div class="app-placeholder-desc">Add a Description...</div>
        </div>

        <div class="app-grid">
          <!-- Notes -->
          <div class="app-tile notes-tile"><span class="tile-label">Notes</span></div>
          <!-- Tasks -->
          <div class="app-tile tasks-tile"><span class="tile-label">Tasks</span></div>
          <!-- Location -->
          <div class="app-tile location-tile"><span class="tile-label">Location</span></div>
          <!-- Website -->
          <div class="app-tile website-tile"><span class="tile-label tile-label-light">Website</span></div>
          <!-- Photo -->
          <div class="app-tile photo-tile"><span class="tile-label tile-label-light">Photo</span></div>
          <!-- Date -->
          <div class="app-tile date-tile" id="openDatePickerBtn"><span class="tile-label tile-label-light">Date</span></div>
        </div>
      </div>

      <div class="app-footer">
        <button class="invite-btn">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
            <line x1="12" y1="5" x2="12" y2="19" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            <line x1="5" y1="12" x2="19" y2="12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
          Invite
        </button>
        <button class="fab-add">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
            <line x1="12" y1="5" x2="12" y2="19" stroke="white" stroke-width="2" stroke-linecap="round"/>
            <line x1="5" y1="12" x2="19" y2="12" stroke="white" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </button>
      </div>
    </div>

    <!-- Backdrop (dims app behind sheet) -->
    <div class="backdrop" id="backdrop"></div>

    <!-- ══════════════════════════════════
         DATE PICKER SHEET
    ══════════════════════════════════ -->
    <div class="sheet picker-sheet" id="pickerSheet">
      <div class="sheet-handle"></div>

      <!-- Segmented Control -->
      <div class="seg-control" id="segControl">
        <button class="seg active" data-tab="one-day">One Day</button>
        <button class="seg" data-tab="multi-day">Multi-Day</button>
        <button class="seg" data-tab="repeating">Repeating</button>
      </div>

      <!-- TAB: One Day -->
      <div class="tab-pane active" id="tab-one-day">
        <div class="date-section">
          <div class="date-section-lbl">Start Date</div>
          <div class="date-field" id="oneDayField" data-action="open-cal-start"></div>
        </div>
      </div>

      <!-- TAB: Multi-Day -->
      <div class="tab-pane" id="tab-multi-day">
        <div class="multi-row">
          <div class="date-section flex-1">
            <div class="date-section-lbl">Start Date</div>
            <div class="date-field" id="multiStartField" data-action="open-cal-multi-start"></div>
          </div>
          <div class="multi-arrow" id="multiArrow">
            <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
              <path d="M4 10H16M16 10L11 5M16 10L11 15" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </div>
          <div class="date-section flex-1 align-right">
            <div class="date-section-lbl text-right">End Date</div>
            <div class="date-field text-right" id="multiEndField" data-action="open-cal-multi-end"></div>
          </div>
        </div>
      </div>

      <!-- TAB: Repeating -->
      <div class="tab-pane" id="tab-repeating">
        <div class="repeating-section">
          <div class="every-lbl">Every</div>
          <button class="repeating-day-btn" id="repeatingDayBtn">
            <span id="repeatingDayLabel">Monday</span>
            <svg width="22" height="22" viewBox="0 0 22 22" fill="none">
              <path d="M7 8.5l4-4 4 4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M7 13.5l4 4 4-4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
        </div>
      </div>

      <!-- Shared: Time + Title + Done -->
      <div class="picker-extras">
        <div class="time-row" id="startTimeRow">
          <span class="time-lbl">Start Time</span>
          <div class="time-right">
            <span class="time-add-icon">
              <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                <path d="M8 3.33V12.67M3.33 8H12.67" stroke="black" stroke-width="1.33" stroke-linecap="round"/>
              </svg>
            </span>
            <span class="time-clock-icon">
              <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                <path d="M2.5 5H13.5" stroke="currentColor" stroke-width="1.33" stroke-linecap="round"/>
                <path d="M6 5V4C6 3.45 6.45 3 7 3H9C9.55 3 10 3.45 10 4V5" stroke="currentColor" stroke-width="1.33" stroke-linecap="round"/>
                <path d="M4 5L4.5 12C4.5 12.55 4.95 13 5.5 13H10.5C11.05 13 11.5 12.55 11.5 12L12 5" stroke="currentColor" stroke-width="1.33" stroke-linecap="round" stroke-linejoin="round"/>
                <line x1="6.5" y1="7" x2="6.5" y2="11" stroke="currentColor" stroke-width="1.33" stroke-linecap="round"/>
                <line x1="9.5" y1="7" x2="9.5" y2="11" stroke="currentColor" stroke-width="1.33" stroke-linecap="round"/>
              </svg>
            </span>
            <span class="time-val-text" id="startTimeDisplay">Add time</span>
          </div>
        </div>
        <div class="row-sep"></div>
        <div class="time-row" id="endTimeRow">
          <span class="time-lbl">End Time</span>
          <div class="time-right">
            <span class="time-add-icon">
              <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                <path d="M8 3.33V12.67M3.33 8H12.67" stroke="black" stroke-width="1.33" stroke-linecap="round"/>
              </svg>
            </span>
            <span class="time-clock-icon">
              <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                <path d="M2.5 5H13.5" stroke="currentColor" stroke-width="1.33" stroke-linecap="round"/>
                <path d="M6 5V4C6 3.45 6.45 3 7 3H9C9.55 3 10 3.45 10 4V5" stroke="currentColor" stroke-width="1.33" stroke-linecap="round"/>
                <path d="M4 5L4.5 12C4.5 12.55 4.95 13 5.5 13H10.5C11.05 13 11.5 12.55 11.5 12L12 5" stroke="currentColor" stroke-width="1.33" stroke-linecap="round" stroke-linejoin="round"/>
                <line x1="6.5" y1="7" x2="6.5" y2="11" stroke="currentColor" stroke-width="1.33" stroke-linecap="round"/>
                <line x1="9.5" y1="7" x2="9.5" y2="11" stroke="currentColor" stroke-width="1.33" stroke-linecap="round"/>
              </svg>
            </span>
            <span class="time-val-text" id="endTimeDisplay">Add time</span>
          </div>
        </div>
        <div class="event-title-wrap">
          <input type="text" class="event-title-input" placeholder="Event Title" id="eventTitleInput" autocomplete="off" />
        </div>
        <button class="done-btn" id="doneBtn">Done</button>
      </div>
    </div>

    <!-- Calendar backdrop (dims picker behind calendar) -->
    <div class="cal-backdrop" id="calBackdrop"></div>

    <!-- ══════════════════════════════════
         CALENDAR SHEET
    ══════════════════════════════════ -->
    <div class="sheet cal-sheet" id="calSheet">
      <div class="sheet-handle"></div>
      <div class="cal-header">
        <button class="cal-month-title" id="calMonthTitle">
          <span id="calMonthText">August 2024</span>
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
            <path d="M4.5 2.5l5 4.5-5 4.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
        <div class="cal-nav-group">
          <button class="cal-nav-btn" id="calPrevBtn">
            <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
              <path d="M11 13.5L6.5 9 11 4.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
          <button class="cal-nav-btn" id="calNextBtn">
            <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
              <path d="M7 4.5L11.5 9 7 13.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
        </div>
      </div>
      <div class="cal-weekdays">
        <span>SUN</span><span>MON</span><span>TUE</span>
        <span>WED</span><span>THU</span><span>FRI</span><span>SAT</span>
      </div>
      <div class="cal-grid" id="calGrid"></div>
    </div>

    <!-- ══════════════════════════════════
         TIME PICKER OVERLAY
    ══════════════════════════════════ -->
    <div class="time-overlay" id="timeOverlay">
      <div class="time-ov-backdrop" id="timeOvBackdrop"></div>
      <div class="time-ov-card">
        <div class="time-ov-handle"></div>
        <div class="time-ov-header">
          <button class="time-ov-cancel" id="tpCancelBtn">Cancel</button>
          <button class="time-ov-done"   id="tpDoneBtn">Done</button>
        </div>
        <div class="drum-outer">
          <div class="drum-highlight"></div>
          <div class="drum-fade-top"></div>
          <div class="drum-fade-bottom"></div>
          <div class="drum-cols">
            <div class="drum-col" id="ovHourDrum"></div>
            <div class="drum-sep">:</div>
            <div class="drum-col" id="ovMinDrum"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- Day sheet backdrop -->
    <div class="day-backdrop" id="dayBackdrop"></div>

    <!-- ══════════════════════════════════
         DAY PICKER SHEET (Repeating)
    ══════════════════════════════════ -->
    <div class="sheet day-sheet" id="daySheet">
      <div class="sheet-handle"></div>
      <div class="day-list" id="dayList"></div>
    </div>

  </div><!-- /phone -->
</div><!-- /scene -->

<script src="script.js"></script>
</body>
</html>
