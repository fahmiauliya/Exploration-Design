<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Starred Quotes</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="device-frame">
  <!-- STATUS BAR -->
  <div class="status-bar">
    <div class="status-time-wrap">
      <span class="status-time">9:41</span>
    </div>
    <div class="status-icons">
      <svg width="17" height="11" viewBox="0 0 17 11" fill="none">
        <rect x="0" y="3" width="3" height="8" rx="1" fill="#fff"/>
        <rect x="4.5" y="2" width="3" height="9" rx="1" fill="#fff"/>
        <rect x="9" y="1" width="3" height="10" rx="1" fill="#fff"/>
        <rect x="13.5" y="0" width="3" height="11" rx="1" fill="#fff"/>
      </svg>
      <svg width="15" height="11" viewBox="0 0 15 11" fill="none">
        <path d="M7.5 10.5C8.33 10.5 9 9.83 9 9C9 8.17 8.33 7.5 7.5 7.5C6.67 7.5 6 8.17 6 9C6 9.83 6.67 10.5 7.5 10.5Z" fill="#fff"/>
        <path d="M3.75 7.12C4.8 6.07 6.15 5.5 7.5 5.5C8.85 5.5 10.2 6.07 11.25 7.12" stroke="#fff" stroke-width="1.2" stroke-linecap="round"/>
        <path d="M1.5 4.5C3.2 2.8 5.35 1.9 7.5 1.9C9.65 1.9 11.8 2.8 13.5 4.5" stroke="#fff" stroke-width="1.2" stroke-linecap="round"/>
      </svg>
      <svg width="25" height="12" viewBox="0 0 25 12" fill="none">
        <rect x="0.5" y="0.5" width="21" height="11" rx="2" stroke="#fff" stroke-opacity="0.35"/>
        <rect x="2" y="2" width="18" height="7" rx="1" fill="#fff"/>
        <path d="M23 4V8C23.8 7.66 24.5 6.93 24.5 6C24.5 5.07 23.8 4.34 23 4Z" fill="#fff" fill-opacity="0.4"/>
      </svg>
    </div>
  </div>

  <!-- NAVIGATION BAR -->
  <div class="nav-bar">
    <div class="nav-left">
      <button class="nav-btn back-btn" id="backBtn">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
          <path d="M12.5 5L7.5 10L12.5 15" stroke="white" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>
    <div class="nav-center">
      <button class="status-pill">
        <span class="status-dot"></span>
        <span class="status-label">Active</span>
      </button>
    </div>
    <div class="nav-right">
      <button class="nav-btn nav-actions" id="navActions">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
          <path d="M10.8334 3.33334V6.66668C5.3542 7.52334 3.3167 12.3233 2.50003 16.6667C2.4692 16.8383 6.9867 11.6983 10.8334 11.6667V15L17.5 9.16668L10.8334 3.33334Z" stroke="white" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span class="nav-divider"></span>
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
          <path d="M7.5 12.5L12.5 7.5" stroke="white" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M9.16663 4.99996L9.55246 4.55329C10.334 3.7719 11.3939 3.33296 12.499 3.33304C13.6041 3.33312 14.664 3.77221 15.4454 4.55371C16.2268 5.33521 16.6657 6.39512 16.6656 7.50025C16.6656 8.60539 16.2265 9.66523 15.445 10.4466L15 10.8333" stroke="white" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M10.8334 15L10.5025 15.445C9.71191 16.2268 8.64486 16.6653 7.53295 16.6653C6.42105 16.6653 5.354 16.2268 4.56337 15.445C4.17367 15.0597 3.86428 14.6008 3.65313 14.0951C3.44198 13.5894 3.33325 13.0468 3.33325 12.4987C3.33325 11.9507 3.44198 11.4081 3.65313 10.9024C3.86428 10.3966 4.17367 9.93782 4.56337 9.55249L5.00004 9.16666" stroke="white" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>
  </div>

  <!-- MAIN CONTENT -->
  <div class="content">
    <h1 class="quote-title" id="quoteTitle">When Life Is Hard, Growth Begins</h1>

    <div class="cards-section">
      <!-- Cards carousel -->
      <div class="cards-track" id="cardsTrack">
        <!-- Cards will be injected by JS -->
      </div>

      <!-- Action bar -->
      <div class="action-bar" id="actionBar">
        <!-- Action buttons injected by JS -->
      </div>
    </div>

    <div class="page-indicator">
      <span class="page-number" id="pageNumber">1/4</span>
    </div>
  </div>

  <!-- HOME INDICATOR -->
  <div class="home-indicator"></div>
</div>

<script src="app.js"></script>

</body>
</html>
