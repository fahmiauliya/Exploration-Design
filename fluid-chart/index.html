<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Fluid Chart</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>

    <div class="device-frame">

      <!-- ── DYNAMIC ISLAND ─────────────────────────── -->
      <div class="dynamic-island"></div>

      <!-- ── STATUS BAR ────────────────────────────── -->
      <div class="status-bar">
        <span class="status-time">9:41</span>
        <div class="status-icons">
          <!-- Signal bars -->
          <svg width="17" height="12" viewBox="0 0 17 12" fill="none">
            <rect x="0"    y="5"  width="3" height="7"  rx="1" fill="currentColor" opacity="0.3"/>
            <rect x="4.5"  y="3"  width="3" height="9"  rx="1" fill="currentColor" opacity="0.5"/>
            <rect x="9"    y="1"  width="3" height="11" rx="1" fill="currentColor" opacity="0.75"/>
            <rect x="13.5" y="0"  width="3" height="12" rx="1" fill="currentColor"/>
          </svg>
          <!-- WiFi -->
          <svg width="16" height="12" viewBox="0 0 16 12" fill="none">
            <path d="M8 10.5C8.828 10.5 9.5 9.828 9.5 9C9.5 8.172 8.828 7.5 8 7.5C7.172 7.5 6.5 8.172 6.5 9C6.5 9.828 7.172 10.5 8 10.5Z" fill="currentColor"/>
            <path d="M4.5 7C5.8 5.7 7 5.2 8 5.2C9 5.2 10.2 5.7 11.5 7" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
            <path d="M1.5 4.2C3.6 2.1 5.8 1 8 1C10.2 1 12.4 2.1 14.5 4.2" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" opacity="0.5"/>
          </svg>
          <!-- Battery -->
          <div class="battery-wrap">
            <div class="battery-body"><div class="battery-fill"></div></div>
            <div class="battery-cap"></div>
          </div>
        </div>
      </div>

      <!-- ── NAVBAR ────────────────────────────────── -->
      <header class="nav">
        <!-- Left: back -->
        <button class="nav-btn nav-btn--circle" aria-label="Back">
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
            <path d="M11 14L6 9L11 4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>

        <!-- Center: token -->
        <div class="nav-token">
          <img src="assets/usdc.png" alt="USDC" class="token-logo" width="36" height="36"/>
          <div class="token-meta">
            <span class="token-name">USDC</span>
            <span class="token-sub">USD Coin</span>
          </div>
        </div>

        <!-- Right: actions -->
        <div class="nav-actions">
          <button class="nav-btn nav-btn--ghost" aria-label="Watchlist">
            <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
              <path d="M10 2.5L12.163 7.516L17.5 8.25L13.6 11.984L14.725 17.25L10 14.625L5.275 17.25L6.4 11.984L2.5 8.25L7.837 7.516L10 2.5Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
            </svg>
          </button>
          <button class="nav-btn nav-btn--ghost" aria-label="More">
            <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
              <circle cx="4.5"  cy="10" r="1.25" fill="currentColor"/>
              <circle cx="10"   cy="10" r="1.25" fill="currentColor"/>
              <circle cx="15.5" cy="10" r="1.25" fill="currentColor"/>
            </svg>
          </button>
        </div>
      </header>

      <!-- ── PRICE HERO ─────────────────────────────── -->
      <div class="price-hero">
        <div class="price-main" id="priceMain">$4,218.36</div>
        <div class="price-meta-row">
          <span class="change-badge positive" id="changeBadge">
            <svg width="9" height="9" viewBox="0 0 9 9" fill="none">
              <path d="M4.5 1.5L7.5 6H1.5L4.5 1.5Z" fill="currentColor"/>
            </svg>
            +$101.44
          </span>
          <span class="change-pct positive" id="changePct">+2.46% 24h</span>
        </div>
      </div>

      <!-- ── CHART ──────────────────────────────────── -->
      <div class="chart-wrap" id="chartWrap">
        <svg class="chart-svg" id="chartSvg"
             viewBox="0 0 375 300"
             preserveAspectRatio="none"
             xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="chartGrad" x1="0" y1="0" x2="0" y2="1">
              <stop id="gradStop0" offset="0%"   stop-color="#22c55e" stop-opacity="0.22"/>
              <stop id="gradStop1" offset="60%"  stop-color="#22c55e" stop-opacity="0.06"/>
              <stop id="gradStop2" offset="100%" stop-color="#22c55e" stop-opacity="0"/>
            </linearGradient>
            <clipPath id="chartClip">
              <rect x="0" y="0" width="375" height="300"/>
            </clipPath>
          </defs>
          <path id="chartArea" fill="url(#chartGrad)" clip-path="url(#chartClip)"/>
          <path id="chartLine" fill="none" stroke="#22c55e" stroke-width="2.2"
                stroke-linecap="round" stroke-linejoin="round" clip-path="url(#chartClip)"/>
          <!-- Hover elements -->
          <line id="hoverLine" x1="0" y1="0" x2="0" y2="300"
                stroke="rgba(0,0,0,0.12)" stroke-width="1" stroke-dasharray="4 3" opacity="0"/>
          <circle id="hoverDot" r="4.5" fill="#22c55e" stroke="white"
                  stroke-width="2.5" opacity="0"/>
        </svg>

        <!-- Tooltip -->
        <div class="chart-tooltip" id="chartTooltip">
          <span class="tt-price" id="ttPrice">$4,218.36</span>
          <span class="tt-time"  id="ttTime">Now</span>
        </div>
      </div>

      <!-- ── TIME FILTERS ──────────────────────────── -->
      <div class="time-filters" id="timeFilters">
        <button class="tf-btn" data-tf="1H">1H</button>
        <button class="tf-btn active" data-tf="1D">1D</button>
        <button class="tf-btn" data-tf="1W">1W</button>
        <button class="tf-btn" data-tf="1M">1M</button>
        <button class="tf-btn" data-tf="1Y">1Y</button>
      </div>

      <!-- ── STATS CARD ─────────────────────────────── -->
      <div class="stats-card">
        <div class="stat-col">
          <span class="stat-label">24H HIGH</span>
          <span class="stat-val" id="statHigh">$4,240.10</span>
        </div>
        <div class="stat-sep"></div>
        <div class="stat-col">
          <span class="stat-label">24H LOW</span>
          <span class="stat-val" id="statLow">$4,101.55</span>
        </div>
        <div class="stat-sep"></div>
        <div class="stat-col">
          <span class="stat-label">VOLUME</span>
          <span class="stat-val" id="statVol">$18.4B</span>
        </div>
      </div>

      <!-- ── BALANCE CARD ───────────────────────────── -->
      <div class="balance-card">
        <div class="balance-row">
          <div class="balance-left">
            <span class="balance-label">YOUR BALANCE</span>
            <span class="balance-amount" id="balanceAmount">4,218.36 USDC</span>
          </div>
          <div class="balance-right">
            <span class="balance-usd" id="balanceUsd">$4,218.36</span>
            <span class="balance-change positive" id="balanceChange">+$101.44 today</span>
          </div>
        </div>
        <div class="bar-wrap">
          <div class="bar-fill" id="barFill"></div>
        </div>
        <div class="bar-labels">
          <span>USDC 62%</span>
          <span>Other 38%</span>
        </div>
      </div>

      <!-- ── ACTION BUTTONS ────────────────────────── -->
      <div class="action-row">
        <button class="btn-swap">
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
            <path d="M2 6h12M14 6l-3-3M14 6l-3 3" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M16 12H4M4 12l3 3M4 12l3-3" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          Swap
        </button>
        <button class="btn-send">
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
            <path d="M15.5 2.5L1.5 8l5.5 2.5L9.5 16l6-13.5z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
            <path d="M7 10.5l2.5-2.5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
          </svg>
          Send
        </button>
      </div>

      <!-- ── HOME INDICATOR ────────────────────────── -->
      <div class="home-bar"></div>

    </div>

    <script src="script.js"></script>
  </body>
</html>
